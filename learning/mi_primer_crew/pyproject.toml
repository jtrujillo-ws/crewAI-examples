[project]
name = "mi_primer_crew"
version = "0.1.0"
description = "mi_primer_crew: ejemplo didactico Fase 0-1 con crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.2,<2.0.0"
]

[project.scripts]
mi_primer_crew = "mi_primer_crew.main:run"
run_crew = "mi_primer_crew.main:run"
train = "mi_primer_crew.main:train"
replay = "mi_primer_crew.main:replay"
test = "mi_primer_crew.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
